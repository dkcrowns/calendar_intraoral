<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DK">
<title>DK Schedule</title>
<link rel="manifest" href="manifest.json">
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f1f5f9;color:#0f172a}

/* ── TOKENS ── */
:root{
  --bg:#f1f5f9;
  --hdr:#0f172a;
  --hdr-spec:#1e3a5f;
  --primary:#1e40af;
  --primary-lt:#dbeafe;
  --danger:#dc2626;
  --danger-lt:#fef2f2;
  --success:#16a34a;
  --border:#e2e8f0;
  --muted:#64748b;
  --white:#fff;
  --radius:12px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}

/* ── HEADER ── */
.hdr{
  background:var(--hdr);color:var(--white);
  padding:calc(var(--st) + 14px) 18px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;transition:background .25s;
}
.hdr.spec{background:var(--hdr-spec)}
.hdr-title{font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr-badge{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);
  transition:all .2s;
}
.hdr.spec .hdr-badge{background:rgba(251,191,36,.2);color:#fbbf24}

/* ── WEEK NAV ── */
.week-nav{
  background:var(--hdr);display:flex;align-items:center;
  justify-content:space-between;padding:0 18px 14px;
  flex-shrink:0;transition:background .25s;gap:8px;
}
.week-nav.spec{background:var(--hdr-spec)}
.nav-btn{
  background:rgba(255,255,255,.1);border:none;color:var(--white);
  width:34px;height:34px;border-radius:8px;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0;
}
.nav-btn:active{background:rgba(255,255,255,.22)}
.week-label{color:rgba(255,255,255,.8);font-size:13px;font-weight:600;text-align:center;flex:1}
.today-btn{
  background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.8);
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;
  cursor:pointer;white-space:nowrap;transition:background .15s;
}
.today-btn:active{background:rgba(255,255,255,.22)}

/* ── DAY TABS ── */
.day-tabs{
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--white);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.day-tab{
  display:flex;flex-direction:column;align-items:center;
  padding:9px 2px;cursor:pointer;border-bottom:3px solid transparent;
  transition:border-color .15s;gap:3px;
}
.day-tab.active{border-bottom-color:var(--primary)}
.day-tab.active .day-name{color:var(--primary)}
.d-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.d-num{
  font-size:17px;font-weight:700;color:#0f172a;
  min-width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.day-tab.today .d-num{background:var(--primary);color:var(--white)}
.day-tab.active .d-name{color:var(--primary)}

/* ── SLOT DOTS on tab ── */
.d-dot{height:5px;display:flex;gap:2px;align-items:center;justify-content:center}
.dot{width:4px;height:4px;border-radius:50%}
.dot.busy{background:var(--danger)}
.dot.booked{background:var(--primary)}

/* ── SLOTS AREA ── */
.slots{
  flex:1;overflow-y:auto;padding:10px 14px;
  display:flex;flex-direction:column;gap:5px;
  padding-bottom:calc(var(--sb) + 76px);
}

/* ── SLOT CARD ── */
.slot{
  background:var(--white);border-radius:10px;
  border:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  cursor:pointer;transition:transform .1s,background .15s;
  min-height:50px;position:relative;overflow:hidden;
}
.slot::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:4px;border-radius:10px 0 0 10px;
  background:var(--border);
}
.slot:active{transform:scale(.985)}

.slot.busy{background:var(--danger-lt);border-color:#fecaca;cursor:default}
.slot.busy::before{background:var(--danger)}
.slot.busy:active{transform:none}

.slot.booked{background:var(--primary-lt);border-color:#bfdbfe;cursor:default}
.slot.booked::before{background:var(--primary)}

.slot.mine{cursor:pointer}
.slot.past{opacity:.38;cursor:default}
.slot.past:active{transform:none}

/* Specialist mode — free slots are tappable */
.spec-view .slot.free{background:#f8faff;cursor:pointer}
.spec-view .slot.free:hover{background:#eff6ff}
.spec-view .slot.busy{cursor:pointer}
.spec-view .slot.busy:active{transform:scale(.985)}
.spec-view .slot.booked{cursor:pointer}
.spec-view .slot.booked:active{transform:scale(.985)}
.spec-view .slot.past{cursor:default}
.spec-view .slot.past:active{transform:none}

.s-time{
  font-size:13px;font-weight:700;color:var(--muted);
  min-width:40px;font-variant-numeric:tabular-nums;flex-shrink:0;
}
.s-info{flex:1;min-width:0}
.s-status{font-size:14px;font-weight:600;color:#0f172a;line-height:1.3}
.slot.busy .s-status{color:var(--danger)}
.slot.booked .s-status{color:var(--primary)}
.s-label{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.s-btn{
  background:transparent;border:none;width:32px;height:32px;
  border-radius:8px;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:var(--danger);transition:background .15s;
}
.s-btn:active{background:rgba(220,38,38,.1)}
.s-btn.lock{color:#94a3b8;font-size:18px}
.s-btn.lock:active{background:rgba(100,116,139,.1)}

/* ── BOTTOM BAR ── */
.bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  padding:10px 14px calc(var(--sb) + 10px);
  background:var(--white);border-top:1px solid var(--border);
  display:flex;gap:8px;z-index:10;
}
.btn{
  border:none;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;padding:12px 14px;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
  font-family:inherit;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--primary);color:var(--white);flex:1}
.btn-ghost{background:var(--bg);color:#0f172a;border:1px solid var(--border)}
.btn-exit{background:#fef2f2;color:var(--danger);flex:1}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:100;display:flex;align-items:flex-end;
  animation:fadeIn .18s;
}
.overlay.center{align-items:center;padding:20px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--white);width:100%;max-width:480px;margin:0 auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(var(--sb) + 20px);
  animation:slideUp .25s;max-height:92vh;overflow-y:auto;
}
.overlay.center .modal{border-radius:18px;padding:20px 18px}
@keyframes slideUp{from{transform:translateY(32px);opacity:0}to{transform:translateY(0);opacity:1}}
.handle{width:36px;height:4px;background:var(--border);border-radius:100px;margin:0 auto 18px}
.m-title{font-size:18px;font-weight:800;margin-bottom:3px}
.m-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.inp{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);
  border-radius:10px;font-size:15px;color:#0f172a;background:var(--white);
  transition:border-color .15s;outline:none;font-family:inherit;
}
.inp:focus{border-color:var(--primary)}
.m-actions{display:flex;gap:8px;margin-top:18px}

/* ── PIN ── */
.pin-row{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin-d{
  width:58px;height:62px;border:2px solid var(--border);border-radius:12px;
  font-size:22px;font-weight:800;text-align:center;color:#0f172a;
  background:var(--white);outline:none;transition:border-color .15s;
  font-family:inherit;caret-color:transparent;
}
.pin-d:focus{border-color:var(--primary)}
.pin-err{font-size:13px;color:var(--danger);text-align:center;min-height:18px;font-weight:600}

/* ── LOADING ── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--muted);font-size:14px}
.spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── TOAST ── */
.toast{
  position:fixed;top:calc(var(--st) + 88px);left:50%;
  transform:translateX(-50%);background:#0f172a;color:var(--white);
  padding:9px 18px;border-radius:100px;font-size:13px;font-weight:600;
  z-index:200;animation:toastAnim 2.6s forwards;white-space:nowrap;
  pointer-events:none;
}
@keyframes toastAnim{
  0%{opacity:0;transform:translateX(-50%) translateY(-8px)}
  12%{opacity:1;transform:translateX(-50%) translateY(0)}
  75%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px)}
}

/* ── SPECIALIST HINT ── */
.spec-hint{
  font-size:11px;text-align:center;color:rgba(255,255,255,.45);
  padding:0 18px 10px;background:var(--hdr-spec);transition:background .25s;
  flex-shrink:0;
}
</style>
</head>
<body>
<div id="app">
  <div class="hdr" id="hdr">
    <span class="hdr-title">DK Schedule</span>
    <span class="hdr-badge" id="badge">Команда</span>
  </div>
  <div class="week-nav" id="weekNav">
    <button class="nav-btn" id="prevBtn">◀</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="today-btn" id="todayBtn">сегодня</button>
    <button class="nav-btn" id="nextBtn">▶</button>
  </div>
  <div class="day-tabs" id="dayTabs"></div>
  <div class="slots" id="slots"><div class="loading"><div class="spin"></div>Загружаем…</div></div>
  <div class="bar">
    <button class="btn btn-ghost" id="nameBtn" style="display:none">👤 <span id="nameLbl"></span></button>
    <button class="btn btn-primary" id="modeBtn">🔑 Войти как специалист</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════
const SB_URL = 'https://foqooqibdfcadndoipvz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvcW9vcWliZGZjYWRuZG9pcHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODIxODIsImV4cCI6MjExMDA1ODE4Mn0.Y7u0ZMQjs7PfKhcbzfBav_PJYH3bieNQAF4vdLMBpjs';

const TIMES = Array.from({length: 18}, (_, i) => {
  const h = Math.floor(i / 2) + 9;
  const m = i % 2 === 0 ? '00' : '30';
  return `${String(h).padStart(2,'0')}:${m}`;
});

const DAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

// ════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════
const S = {
  sb: null,
  mode: 'team',                                       // 'team' | 'specialist'
  specName: null,
  userName: localStorage.getItem('dk_name') || null,
  selectedDay: 0,                                     // 0=Mon … 5=Sat
  weekStart: getMonday(new Date()),
  slots: {},                                          // key: "YYYY-MM-DD_HH:MM" → row
  sub: null,
};

// ════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════
function getMonday(d) {
  const r = new Date(d);
  const dow = r.getDay();
  r.setDate(r.getDate() + (dow === 0 ? -6 : 1 - dow));
  r.setHours(0, 0, 0, 0);
  return r;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function slotKey(date, time) {
  return `${fmtDate(date)}_${time}`;
}

function isToday(d) {
  const n = new Date();
  return d.getDate() === n.getDate() && d.getMonth() === n.getMonth() && d.getFullYear() === n.getFullYear();
}

function isPast(date, time) {
  const [h, m] = time.split(':').map(Number);
  const t = new Date(date);
  t.setHours(h, m, 0, 0);
  return t < new Date();
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ════════════════════════════════════════════════
// SUPABASE INIT & REALTIME
// ════════════════════════════════════════════════
async function initSB() {
  S.sb = window.supabase.createClient(SB_URL, SB_KEY);

  // Проверить сохранённый PIN
  const savedPin = sessionStorage.getItem('dk_pin');
  if (savedPin) {
    const r = await validatePin(savedPin);
    if (r) { S.mode = 'specialist'; S.specName = r.name; }
    else sessionStorage.removeItem('dk_pin');
  }

  await loadSlots();
  subscribe();
  renderAll();
}

function subscribe() {
  if (S.sub) S.sb.removeChannel(S.sub);
  S.sub = S.sb.channel('slots')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calendar_slots' }, payload => {
      if (payload.eventType === 'DELETE') {
        const t = payload.old.slot_time.substring(0,5);
        delete S.slots[`${payload.old.slot_date}_${t}`];
      } else {
        const row = payload.new;
        const t = row.slot_time.substring(0,5);
        S.slots[`${row.slot_date}_${t}`] = row;
      }
      renderSlots();
      renderDayTabs(); // обновить точки
    })
    .subscribe();
}

// ════════════════════════════════════════════════
// DATA OPS
// ════════════════════════════════════════════════
async function loadSlots() {
  const end = addDays(S.weekStart, 5);
  const { data, error } = await S.sb.from('calendar_slots').select('*')
    .gte('slot_date', fmtDate(S.weekStart))
    .lte('slot_date', fmtDate(end));
  if (error) { toast('Ошибка загрузки'); return; }
  S.slots = {};
  (data || []).forEach(row => {
    const t = row.slot_time.substring(0, 5);
    S.slots[`${row.slot_date}_${t}`] = row;
  });
}

async function validatePin(pin) {
  const { data, error } = await S.sb.from('access_pins').select('*')
    .eq('pin', pin);
  if (error || !data || data.length === 0) return null;
  if (data[0].active === false) return null;
  return data[0];
}

async function markBusy(date, time) {
  const { error } = await S.sb.from('calendar_slots').insert({
    slot_date: fmtDate(date), slot_time: time, status: 'busy'
  });
  if (error) toast('Ошибка');
}

async function unmarkSlot(id) {
  const { error } = await S.sb.from('calendar_slots').delete().eq('id', id);
  if (error) toast('Ошибка');
}

async function bookSlot(date, time, name, label) {
  const { error } = await S.sb.from('calendar_slots').insert({
    slot_date: fmtDate(date), slot_time: time, status: 'booked',
    booked_by: name, label: label || null
  });
  if (error) toast('Ошибка записи');
  else toast('Записано ✓');
}

// ════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════
function renderAll() {
  renderHeader();
  renderWeekNav();
  renderDayTabs();
  renderSlots();
  renderBar();
}

function renderHeader() {
  const spec = S.mode === 'specialist';
  document.getElementById('hdr').className = 'hdr' + (spec ? ' spec' : '');
  document.getElementById('badge').textContent = spec ? `⚡ ${S.specName || 'Специалист'}` : 'Команда';
  document.getElementById('themeColor').content = spec ? '#1e3a5f' : '#0f172a';
}

function renderWeekNav() {
  const spec = S.mode === 'specialist';
  document.getElementById('weekNav').className = 'week-nav' + (spec ? ' spec' : '');
  const s = S.weekStart;
  const e = addDays(s, 5);
  const label = s.getMonth() === e.getMonth()
    ? `${s.getDate()}–${e.getDate()} ${MONTHS[e.getMonth()]} ${e.getFullYear()}`
    : `${s.getDate()} ${MONTHS[s.getMonth()]} – ${e.getDate()} ${MONTHS[e.getMonth()]}`;
  document.getElementById('weekLabel').textContent = label;
}

function renderDayTabs() {
  const c = document.getElementById('dayTabs');
  c.innerHTML = '';
  for (let i = 0; i < 6; i++) {
    const day = addDays(S.weekStart, i);
    const fmtD = fmtDate(day);

    // Считаем точки
    const hasBusy   = Object.values(S.slots).some(r => r.slot_date === fmtD && r.status === 'busy');
    const hasBooked = Object.values(S.slots).some(r => r.slot_date === fmtD && r.status === 'booked');

    const tab = document.createElement('div');
    tab.className = 'day-tab' + (i === S.selectedDay ? ' active' : '') + (isToday(day) ? ' today' : '');
    tab.innerHTML = `
      <span class="d-name">${DAYS_SHORT[i]}</span>
      <span class="d-num">${day.getDate()}</span>
      <div class="d-dot">
        ${hasBusy   ? '<span class="dot busy"></span>'   : ''}
        ${hasBooked ? '<span class="dot booked"></span>' : ''}
      </div>`;
    tab.addEventListener('click', () => { S.selectedDay = i; renderDayTabs(); renderSlots(); });
    c.appendChild(tab);
  }
}

function renderSlots() {
  const c = document.getElementById('slots');
  c.className = 'slots' + (S.mode === 'specialist' ? ' spec-view' : '');
  c.innerHTML = '';

  const date = addDays(S.weekStart, S.selectedDay);
  const spec = S.mode === 'specialist';

  TIMES.forEach(time => {
    const key  = slotKey(date, time);
    const row  = S.slots[key];
    const past = isPast(date, time);

    const type   = row ? row.status : 'free';
    const isMine = row && row.status === 'booked' && row.booked_by === S.userName;

    const card = document.createElement('div');
    let cls = `slot ${type}`;
    if (isMine) cls += ' mine';
    if (past)   cls += ' past';
    card.className = cls;

    // Контент карточки
    let statusTxt = '';
    let labelHtml = '';
    let btnHtml   = '';

    if (type === 'free') {
      statusTxt = past ? 'Прошло' : (spec ? 'Свободно — нажать чтобы занять' : 'Свободно');
      if (!past && !spec) btnHtml = `<button class="s-btn lock" title="Записаться">+</button>`;
      if (!past &&  spec) btnHtml = `<button class="s-btn lock" title="Отметить как занятую">🔒</button>`;
    } else if (type === 'busy') {
      statusTxt = 'Занята';
      if (spec && !past) btnHtml = `<button class="s-btn" title="Снять отметку">✓</button>`;
    } else {
      statusTxt = row.booked_by || 'Занято';
      if (row.label) labelHtml = `<div class="s-label">${row.label}</div>`;
      if (!past && (isMine || spec)) btnHtml = `<button class="s-btn" title="Отменить запись">✕</button>`;
    }

    card.innerHTML = `
      <span class="s-time">${time}</span>
      <div class="s-info">
        <div class="s-status">${statusTxt}</div>
        ${labelHtml}
      </div>
      ${btnHtml}`;

    // Клики
    if (!past) {
      if (spec) {
        if (type === 'free') {
          card.addEventListener('click', () => markBusy(date, time));
        } else {
          // busy → снять; booked → отменить
          const btn = card.querySelector('.s-btn');
          if (btn) btn.addEventListener('click', e => { e.stopPropagation(); confirmDelete(row, type); });
          card.addEventListener('click', () => confirmDelete(row, type));
        }
      } else {
        // Team mode
        if (type === 'free') {
          card.addEventListener('click', () => openBookModal(date, time));
        }
        if (isMine) {
          const btn = card.querySelector('.s-btn');
          if (btn) btn.addEventListener('click', e => { e.stopPropagation(); confirmCancel(row); });
        }
      }
    }

    c.appendChild(card);
  });
}

function renderBar() {
  const spec = S.mode === 'specialist';
  const nameBtn = document.getElementById('nameBtn');
  const modeBtn = document.getElementById('modeBtn');

  if (spec) {
    nameBtn.style.display = 'none';
    modeBtn.className = 'btn btn-exit';
    modeBtn.textContent = '← Выйти из режима специалиста';
  } else {
    modeBtn.className = 'btn btn-primary';
    modeBtn.textContent = '🔑 Войти как специалист';
    if (S.userName) {
      nameBtn.style.display = 'flex';
      document.getElementById('nameLbl').textContent = S.userName;
    } else {
      nameBtn.style.display = 'none';
    }
  }
}

// ════════════════════════════════════════════════
// MODALS
// ════════════════════════════════════════════════
function openOverlay(html, center = false) {
  const ov = document.createElement('div');
  ov.className = 'overlay' + (center ? ' center' : '');
  ov.innerHTML = `<div class="modal">${html}</div>`;
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}

function openBookModal(date, time) {
  if (!S.userName) { openNameModal(() => openBookModal(date, time)); return; }

  const day  = addDays(S.weekStart, S.selectedDay);
  const sub  = `${time}  ·  ${day.getDate()} ${MONTHS[day.getMonth()]}`;
  const ov   = openOverlay(`
    <div class="handle"></div>
    <div class="m-title">Записаться</div>
    <div class="m-sub">${sub}</div>
    <div class="field">
      <label class="lbl">Ваше имя</label>
      <input class="inp" id="bName" value="${S.userName}" placeholder="Имя">
    </div>
    <div class="field">
      <label class="lbl">Комментарий (необязательно)</label>
      <input class="inp" id="bLabel" placeholder="Например: консультация">
    </div>
    <div class="m-actions">
      <button class="btn btn-ghost" id="bCancel">Отмена</button>
      <button class="btn btn-primary" id="bConfirm">Записаться</button>
    </div>`);

  const m = ov.querySelector('.modal');
  m.querySelector('#bCancel').onclick  = () => ov.remove();
  m.querySelector('#bConfirm').onclick = async () => {
    const name  = m.querySelector('#bName').value.trim();
    const label = m.querySelector('#bLabel').value.trim();
    if (!name) { toast('Введите имя'); return; }
    S.userName = name;
    localStorage.setItem('dk_name', name);
    ov.remove();
    await bookSlot(date, time, name, label);
    renderBar();
  };
  setTimeout(() => m.querySelector('#bName').select(), 300);
}

function openNameModal(cb) {
  const ov = openOverlay(`
    <div class="handle"></div>
    <div class="m-title">Как вас зовут?</div>
    <div class="m-sub">Один раз — запомним на этом устройстве</div>
    <div class="field">
      <input class="inp" id="nInput" placeholder="Ваше имя">
    </div>
    <div class="m-actions">
      <button class="btn btn-primary" id="nSave" style="flex:1">Продолжить</button>
    </div>`);

  const m = ov.querySelector('.modal');
  const save = () => {
    const v = m.querySelector('#nInput').value.trim();
    if (!v) return;
    S.userName = v;
    localStorage.setItem('dk_name', v);
    ov.remove();
    renderBar();
    if (cb) cb();
  };
  m.querySelector('#nSave').onclick = save;
  m.querySelector('#nInput').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  setTimeout(() => m.querySelector('#nInput').focus(), 300);
}

function openPinModal() {
  const ov = openOverlay(`
    <div class="handle"></div>
    <div class="m-title">Вход для специалиста</div>
    <div class="m-sub">Введите PIN-код</div>
    <div class="pin-row">
      <input class="pin-d" maxlength="1" inputmode="numeric" id="p0">
      <input class="pin-d" maxlength="1" inputmode="numeric" id="p1">
      <input class="pin-d" maxlength="1" inputmode="numeric" id="p2">
      <input class="pin-d" maxlength="1" inputmode="numeric" id="p3">
    </div>
    <div class="pin-err" id="pinErr"></div>
    <div class="m-actions">
      <button class="btn btn-ghost" id="pCancel">Отмена</button>
      <button class="btn btn-primary" id="pConfirm" style="flex:1">Войти</button>
    </div>`, true);

  const m    = ov.querySelector('.modal');
  const ins  = m.querySelectorAll('.pin-d');
  const err  = m.querySelector('#pinErr');

  ins.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(-1);
      if (inp.value && i < 3) ins[i + 1].focus();
      if (i === 3 && inp.value) m.querySelector('#pConfirm').click();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) { ins[i-1].focus(); ins[i-1].value = ''; }
    });
  });

  m.querySelector('#pCancel').onclick  = () => ov.remove();
  m.querySelector('#pConfirm').onclick = async () => {
    const pin = Array.from(ins).map(i => i.value).join('');
    if (pin.length < 4) { err.textContent = 'Введите 4 цифры'; return; }
    err.textContent = '';

    const btn = m.querySelector('#pConfirm');
    btn.textContent = '…'; btn.disabled = true;

    const result = await validatePin(pin);
    if (result) {
      S.mode = 'specialist'; S.specName = result.name;
      sessionStorage.setItem('dk_pin', pin);
      ov.remove();
      renderAll();
      toast(`Добро пожаловать, ${result.name} ✓`);
    } else {
      err.textContent = 'Неверный PIN';
      ins.forEach(i => i.value = ''); ins[0].focus();
      btn.textContent = 'Войти'; btn.disabled = false;
    }
  };
  setTimeout(() => ins[0].focus(), 300);
}

function confirmDelete(row, type) {
  const sub = type === 'booked'
    ? `${row.booked_by} · ${row.slot_time.substring(0,5)}${row.label ? ' · ' + row.label : ''}`
    : row.slot_time.substring(0,5);
  const title = type === 'booked' ? 'Отменить запись?' : 'Снять занятость?';
  const ov = openOverlay(`
    <div class="handle"></div>
    <div class="m-title">${title}</div>
    <div class="m-sub">${sub}</div>
    <div class="m-actions">
      <button class="btn btn-ghost" id="no">Нет</button>
      <button class="btn btn-exit" id="yes" style="flex:1">Да, убрать</button>
    </div>`);
  const m = ov.querySelector('.modal');
  m.querySelector('#no').onclick  = () => ov.remove();
  m.querySelector('#yes').onclick = async () => { ov.remove(); await unmarkSlot(row.id); };
}

function confirmCancel(row) {
  const sub = `${row.slot_time.substring(0,5)}${row.label ? ' · ' + row.label : ''}`;
  const ov = openOverlay(`
    <div class="handle"></div>
    <div class="m-title">Отменить запись?</div>
    <div class="m-sub">${sub}</div>
    <div class="m-actions">
      <button class="btn btn-ghost" id="no">Нет</button>
      <button class="btn btn-exit" id="yes" style="flex:1">Отменить запись</button>
    </div>`);
  const m = ov.querySelector('.modal');
  m.querySelector('#no').onclick  = () => ov.remove();
  m.querySelector('#yes').onclick = async () => { ov.remove(); await unmarkSlot(row.id); toast('Запись отменена'); };
}

document.getElementById('prevBtn').onclick = async () => {
  S.weekStart = addDays(S.weekStart, -7);
  renderWeekNav(); renderDayTabs();
  document.getElementById('slots').innerHTML = '<div class="loading"><div class="spin"></div>Загружаем…</div>';
  await loadSlots(); renderDayTabs(); renderSlots();
};

document.getElementById('nextBtn').onclick = async () => {
  S.weekStart = addDays(S.weekStart, 7);
  renderWeekNav(); renderDayTabs();
  document.getElementById('slots').innerHTML = '<div class="loading"><div class="spin"></div>Загружаем…</div>';
  await loadSlots(); renderDayTabs(); renderSlots();
};

document.getElementById('todayBtn').onclick = async () => {
  S.weekStart = getMonday(new Date());
  const dow = new Date().getDay();
  S.selectedDay = dow === 0 ? 0 : dow - 1;
  renderWeekNav(); renderDayTabs();
  await loadSlots(); renderDayTabs(); renderSlots();
};

document.getElementById('modeBtn').onclick = () => {
  if (S.mode === 'specialist') {
    S.mode = 'specialist' === 'specialist' ? 'team' : 'specialist';
    S.mode = 'team'; S.specName = null;
    sessionStorage.removeItem('dk_pin');
    renderAll();
    toast('Вышли из режима специалиста');
  } else {
    openPinModal();
  }
};

document.getElementById('nameBtn').onclick = () => openNameModal();
